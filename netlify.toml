[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION   = "20"
  VITE_USE_PROXY = "true"   # tells the SPA to route Gemini calls through /api/gemini

[functions]
  directory = "netlify/functions"

# ── Gemini proxy ──────────────────────────────────────────────
# Runs as an Edge Function (Deno) so SSE streams are never buffered.
# GEMINI_API_KEY must be set in Netlify UI > Environment variables (server-side only).
[[edge_functions]]
  path     = "/api/gemini/*"
  function = "gemini-proxy"

# ── Anthropic proxy (legacy — kept for reference) ─────────────
[[edge_functions]]
  path     = "/api/v1/messages"
  function = "anthropic-proxy"

# ── SPA fallback ──────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
