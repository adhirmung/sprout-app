[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Route the Anthropic proxy to the Netlify function — must come before the SPA catch-all
[[redirects]]
  from   = "/api/v1/messages"
  to     = "/.netlify/functions/claude"
  status = 200
  force  = true

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
