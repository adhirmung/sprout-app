[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION   = "20"
  VITE_USE_PROXY = "true"   # tells the SPA to route Claude calls through /api

[functions]
  directory = "netlify/functions"

# ── Anthropic proxy ───────────────────────────────────────────
# Runs as an Edge Function (Deno) so SSE streams are never buffered.
# ANTHROPIC_API_KEY must be set in Netlify UI > Environment variables (server-side only).
[[edge_functions]]
  path     = "/api/v1/messages"
  function = "anthropic-proxy"

# ── SPA fallback ──────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
